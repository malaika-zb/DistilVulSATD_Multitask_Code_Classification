# DistilVulSATD default configuration (NLBSE'27) — submitted e5 setup

task:
  labels: ["vulnerability", "MAT"]  # order: [vuln, SATD/MAT]
  max_length: 256

teacher:
  model_name: "NLBSE/nlbse27-code-comment-classification-baseline"

student:
  model_name: "huawei-noah/TinyBERT_General_4L_312D"

distill:
  epochs: 5
  batch_size: 32
  learning_rate: 3.0e-5
  temperature: 4.0
  alpha: 0.7  # soft KD weight
  seed: 42
  val_fraction: 0.05

thresholds:
  # Accepted after val grid search on e5; public-test score 0.8566
  vulnerability: 0.20
  mat: 0.55

evaluation:
  batch_size: 600
  repetitions: 10
  max_avg_runtime: 1000
  max_avg_flops: 3000000
  score_weights:
    f1: 0.6
    runtime: 0.2
    flops: 0.2

data:
  hf_dataset: "NLBSE/nlbse27-code-comment-classification"

artifacts:
  drive_folder: "https://drive.google.com/drive/folders/1Tpe54KkA_N-t6qlt0_C3h-WHuF5T-NQr"
  student_checkpoint_subdir: "checkpoints/student_runs/tinybert_from_official_L256_T4_e5/best_model"
